name: debug-ts

on:
  push:
    branches: [fix/release-0.3.1]

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: scope the .ts segfault
        run: |
          uv run python - <<'PY'
          import subprocess
          from vidfix import generate, convert
          from vidfix.core.attach import build_attach_args
          from vidfix.core.ffmpeg import FFmpegRunner, find_ffmpeg

          ff = find_ffmpeg()
          runner = FFmpegRunner()

          def check(label, path):
              r = subprocess.run([ff, "-hide_banner", "-i", path], capture_output=True, text=True)
              d = subprocess.run([ff, "-hide_banner", "-v", "error", "-i", path, "-f", "null", "-"],
                                 capture_output=True, text=True)
              print(f"{label:34} probe_rc={r.returncode:4} decode_rc={d.returncode:4} stderr={r.stderr.strip()[-90:]!r}")

          generate("base.mp4", duration="1", res="160x120", audio="none")
          generate("a.m4a", duration="1")
          check("plain mp4 (control)", "base.mp4")

          generate("gen.ts", duration="1", res="160x120", audio="tone")
          check("generate -> ts", "gen.ts")

          generate("gen_noaudio.ts", duration="1", res="160x120", audio="none")
          check("generate -> ts (no audio)", "gen_noaudio.ts")

          convert("base.mp4", "conv.ts", fps="25")
          check("convert -> ts", "conv.ts")

          for label, extra in [("attach ts with bsf", ["-bsf:v", "h264_mp4toannexb"]), ("attach ts no bsf", [])]:
              out = label.replace(" ", "_") + ".ts"
              runner.run(["-i", "base.mp4", "-i", "a.m4a", "-map", "0:v:0", "-map", "1:a:0",
                          "-c:v", "copy", *extra, "-c:a", "aac", "-shortest", out])
              check(label, out)
          PY
