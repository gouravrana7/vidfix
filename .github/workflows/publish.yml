name: Publish

on:
  push:
    branches: ["main"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version and check for an existing tag
        id: check
        run: |
          version="$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v5
        if: steps.check.outputs.release == 'true'
        with:
          python-version: "3.12"

      - run: uv build
        if: steps.check.outputs.release == 'true'

      - run: uv publish
        if: steps.check.outputs.release == 'true'

      - name: Tag and create the GitHub Release
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.check.outputs.version }}"
          git tag "v$version"
          git push origin "v$version"
          python3 - "$version" <<'PY' > release-notes.md
          import pathlib, sys

          version = sys.argv[1]
          changelog = pathlib.Path("CHANGELOG.md").read_text()
          marker = f"## [{version}]"
          if marker in changelog:
              section = changelog.split(marker, 1)[1].split("\n## [", 1)[0]
              print(section.split("\n", 1)[1].strip())
          else:
              print("See CHANGELOG.md")
          print()
          print("```bash")
          print(f"pip install --upgrade vidfix    # or: uvx vidfix@{version}")
          print("```")
          PY
          gh release create "v$version" --title "v$version" --notes-file release-notes.md
