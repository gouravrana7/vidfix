[project]
name = "vidfix"
version = "0.1.1"
description = "CLI toolkit to convert, generate, and verify videos and images to exact specs (fps, duration, resolution, format) — test fixtures, CI checks, and everyday conversions."
readme = "README.md"
license = { text = "PolyForm-Internal-Use-1.0.0" }
authors = [
    { name = "Gourav Rana", email = "gourav.rana70000@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["ffmpeg", "video", "testing", "qa", "test-fixtures", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video :: Conversion",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.scripts]
vidfix = "vidfix.cli:app"

[project.urls]
Homepage = "https://github.com/gouravrana7/vidfix"
Issues = "https://github.com/gouravrana7/vidfix/issues"
Changelog = "https://github.com/gouravrana7/vidfix/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "types-pyyaml>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vidfix"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src"
packages = ["vidfix"]

[[tool.mypy.overrides]]
module = "imageio_ffmpeg.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: tests that invoke the real FFmpeg binary (slower)",
]

[tool.coverage.run]
source = ["src/vidfix"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
